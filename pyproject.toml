[project]
name = "x-collector-service"
version = "0.1.0"
description = "FastAPI microservice for collecting X accounts, posts, and replies via pluggable providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1,<2.0.0",
    "fastapi>=0.115.0,<0.116.0",
    "httpx>=0.27.0,<0.29.0",
    "httpx-retries>=0.5.0",
    "loguru>=0.7.2",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
x-collector = "collector.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
